# The only workflow that runs on push; the desktop and Android builds are started by hand.
name: Deploy web app
on:
  push:
    paths:
      - "web/**"
      - ".github/workflows/web.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: web/package-lock.json
    - name: Build
      working-directory: web
      run: |
        npm ci
        npm run build
    - uses: actions/configure-pages@v5
    - uses: actions/upload-pages-artifact@v3
      with:
        path: web/dist
    - id: deployment
      uses: actions/deploy-pages@v4
